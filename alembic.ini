# Usado apenas em desenvolvimento para gerar novas migrações:
#   uv run alembic revision --autogenerate -m "descrição"
# Em execução, o ALFRED aplica as migrações automaticamente no startup.
[alembic]
script_location = src/alfred/infrastructure/db/migrations
file_template = %%(rev)s_%%(slug)s
sqlalchemy.url = sqlite:///data/alfred-dev.db
