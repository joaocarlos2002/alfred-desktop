[project]
name = "alfred-desktop"
version = "0.1.0"
description = "ALFRED — assistente pessoal de IA para Windows 11. Always at your service."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "João Carlos" }]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Private :: Do Not Upload",
]
dependencies = [
    "alembic>=1.14",
    "pydantic>=2.9",
    "pyside6-essentials>=6.8",
    "qasync>=0.27",
    "sqlalchemy>=2.0.36",
]

[project.optional-dependencies]
voice = [
    "numpy>=2.0",
    "sounddevice>=0.5",
    "vosk>=0.3.45",
    "faster-whisper>=1.1",
    "piper-tts>=1.3",
    "pywin32>=306; sys_platform == 'win32'",
]
ai = [
    "httpx>=0.27",
    "keyring>=25.0",
]
automation = [
    "psutil>=6.0",
    "pywinauto>=0.6.9; sys_platform == 'win32'",
    "playwright>=1.48",
    "mss>=9.0",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.scripts]
alfred = "alfred.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "import-linter>=2.1",
    "psutil>=6.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alfred"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PT", "N"]
# ASYNC109: `timeout` explícito é parte intencional das APIs de request/drain/stop.
ignore = ["ASYNC109"]

[tool.ruff.lint.per-file-ignores]
# Em testes, operações síncronas triviais de arquivo dentro de async def são aceitáveis.
"tests/**" = ["ASYNC240", "ASYNC110"]
# Overrides do Qt precisam manter os nomes camelCase (paintEvent, mousePressEvent...).
"src/alfred/ui/**" = ["N802"]
# Migrações geradas pelo Alembic.
"src/alfred/infrastructure/db/migrations/versions/*" = ["E501"]

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["alfred"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["alfred.domain.*", "alfred.core.*"]
strict = true

[[tool.mypy.overrides]]
module = ["qasync", "sounddevice", "vosk", "faster_whisper", "piper", "piper.*", "win32com.*", "pythoncom", "win32gui", "win32process", "win32con", "win32api", "psutil", "pywinauto", "playwright", "playwright.*", "mss", "mss.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- import-linter
# Fronteiras entre módulos: docs/architecture/module-dependencies.md
[tool.importlinter]
root_package = "alfred"

[[tool.importlinter.contracts]]
name = "Camadas do Modular Monolith"
type = "layers"
layers = [
    "alfred.ui",
    "alfred.ai | alfred.voice | alfred.automation | alfred.triggers | alfred.memory",
    "alfred.core",
    "alfred.infrastructure",
    "alfred.config",
    "alfred.domain",
]

[[tool.importlinter.contracts]]
name = "domain não depende de nenhum outro módulo interno"
type = "forbidden"
source_modules = ["alfred.domain"]
forbidden_modules = [
    "alfred.core",
    "alfred.ai",
    "alfred.voice",
    "alfred.automation",
    "alfred.triggers",
    "alfred.memory",
    "alfred.ui",
    "alfred.infrastructure",
    "alfred.config",
]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
filterwarnings = [
    # pywinauto 0.6.9: escapes inválidos em docstrings (problema da biblioteca, não nosso).
    "ignore:invalid escape sequence:SyntaxWarning",
]
markers = [
    "windows: requires a real Windows desktop session (UIA, audio, SendInput, local models)",
]

[tool.coverage.run]
source = ["alfred"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
# Mínimo verificado na CI (testes sem desktop interativo). Ver docs/testing/acceptance.md.
fail_under = 85
