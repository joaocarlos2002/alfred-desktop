[project]
name = "alfred-desktop"
version = "0.1.0"
description = "ALFRED — assistente pessoal de IA para Windows 11. Always at your service."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "João Carlos" }]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Private :: Do Not Upload",
]
dependencies = [
    "pydantic>=2.9",
]

[project.optional-dependencies]
voice = []
ai = []
automation = []

[project.scripts]
alfred = "alfred.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "import-linter>=2.1",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alfred"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PT", "N"]

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["alfred"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["alfred.domain.*", "alfred.core.*"]
strict = true

# ---------------------------------------------------------------- import-linter
# Fronteiras entre módulos: docs/architecture/module-dependencies.md
[tool.importlinter]
root_package = "alfred"

[[tool.importlinter.contracts]]
name = "Camadas do Modular Monolith"
type = "layers"
layers = [
    "alfred.ui",
    "alfred.ai | alfred.voice | alfred.automation | alfred.triggers | alfred.memory",
    "alfred.core",
    "alfred.infrastructure",
    "alfred.config",
    "alfred.domain",
]

[[tool.importlinter.contracts]]
name = "domain não depende de nenhum outro módulo interno"
type = "forbidden"
source_modules = ["alfred.domain"]
forbidden_modules = [
    "alfred.core",
    "alfred.ai",
    "alfred.voice",
    "alfred.automation",
    "alfred.triggers",
    "alfred.memory",
    "alfred.ui",
    "alfred.infrastructure",
    "alfred.config",
]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = [
    "windows: requires a real Windows desktop session",
]

[tool.coverage.run]
source = ["alfred"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
