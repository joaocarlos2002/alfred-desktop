name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --all-extras --dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy

      - name: Fronteiras entre módulos
        run: uv run lint-imports

      - name: Pytest
        run: uv run pytest --cov --cov-report=term-missing -m "not windows"

  security:
    # Cadeia de suprimentos e segredos (docs/security/threat-model.md, T8/T10).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5

      - name: Auditoria de dependências (pip-audit)
        run: |
          uv export --all-extras --no-hashes --no-emit-project --format requirements-txt -q > requirements-audit.txt
          uvx pip-audit -r requirements-audit.txt --no-deps --disable-pip --progress-spinner off

      - name: Varredura de segredos (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
